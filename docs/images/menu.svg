<text x="200.8" y="335" fill="#8c8c8c" textLength="159.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Change the settings</text>
<text x="49.6" y="353" fill="#8c8c8c" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/release-notes  </text>
<text x="200.8" y="353" fill="#8c8c8c" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Show what's new in each version</text>
<text x="49.6" y="371" fill="#8c8c8c" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/tui            </text>
<text x="200.8" y="371" fill="#8c8c8c" textLength="646.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Full screen, or in the terminal's own scrollback: /tui fullscreen or /tui def</text>
<text x="49.6" y="389" fill="#8c8c8c" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/clear          </text>
<text x="200.8" y="389" fill="#8c8c8c" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Clear the screen</text>
