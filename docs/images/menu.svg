<text x="49.6" y="263" fill="#ff8c00" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/pick           </text>
<text x="184.0" y="263" fill="#ff8c00" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Pick a fruit</text>
<text x="49.6" y="281" fill="#8c8c8c" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/list           </text>
<text x="200.8" y="281" fill="#8c8c8c" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Open a list</text>
<text x="49.6" y="299" fill="#8c8c8c" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/wait           </text>
<text x="200.8" y="299" fill="#8c8c8c" textLength="151.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Wait a few seconds</text>
<text x="49.6" y="317" fill="#8c8c8c" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/help           </text>
<text x="200.8" y="317" fill="#8c8c8c" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Show the commands and keys</text>
