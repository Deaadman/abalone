<svg xmlns="http://www.w3.org/2000/svg" width="872" height="500" viewBox="0 0 872 500" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14">
<rect width="872" height="500" rx="8" fill="#16161e"/>
<rect x="16.0" y="16" width="25.2" height="18" fill="#2d2d2d"/>
<text x="16.0" y="29" fill="#8c8c8c" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ❯ </text>
<rect x="41.2" y="16" width="806.4" height="18" fill="#2d2d2d"/>
<text x="41.2" y="29" fill="#ebebeb" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/pick apple                                                                                     </text>
<text x="16.0" y="65" fill="#d8d8e0" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Picked apple</text>
<rect x="16.0" y="88" width="25.2" height="18" fill="#2d2d2d"/>
<text x="16.0" y="101" fill="#8c8c8c" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ❯ </text>
<rect x="41.2" y="88" width="806.4" height="18" fill="#2d2d2d"/>
<text x="41.2" y="101" fill="#ebebeb" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">/wait                                                                                           </text>
<text x="16.0" y="137" fill="#ff8c00" textLength="831.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">───────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="16.0" y="173" fill="#ff8c00" font-weight="bold" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Help</text>
<rect x="83.2" y="160" width="75.6" height="18" fill="#ebebeb"/>
<text x="83.2" y="173" fill="#000000" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> General </text>
<text x="175.6" y="173" fill="#d8d8e0" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Commands </text>
<text x="16.0" y="209" fill="#d8d8e0" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  A demo of everything Abalone can change.</text>
<text x="16.0" y="245" fill="#d8d8e0" font-weight="bold" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Commands</text>
<text x="16.0" y="263" fill="#d8d8e0" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    /pick takes a fruit; Tab completes it.</text>
<text x="16.0" y="281" fill="#d8d8e0" textLength="344.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    /list opens a panel of the app's own.</text>
<text x="16.0" y="317" fill="#d8d8e0" font-weight="bold" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Keys</text>
<text x="16.0" y="335" fill="#d8d8e0" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Enter            run the line, or the highlighted command</text>
<text x="16.0" y="353" fill="#d8d8e0" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Tab, →           complete the highlighted suggestion</text>
<text x="16.0" y="371" fill="#d8d8e0" textLength="512.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    ↑ ↓              move in the menu; otherwise walk history</text>
<text x="16.0" y="389" fill="#d8d8e0" textLength="436.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    Esc              hide the menu, or close a panel</text>
<text x="16.0" y="407" fill="#8c8c8c" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ↓ 2 more</text>
<text x="16.0" y="443" fill="#8c8c8c" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  For more help: </text>
<text x="158.8" y="443" fill="#d8d8e0" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">https://example.com/demo</text>
<text x="16.0" y="479" fill="#8c8c8c" textLength="285.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ↑↓ scroll · ←→ tabs · Esc closes</text>
</svg>
