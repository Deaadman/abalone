# Publishes a release that install.ps1, install.sh and the updater
# download: push a tag like 0.1.0 (no v prefix) that matches the version of
# the {{PACKAGE}} package. Each platform below is built on its own runner;
# the release carries every build ({{APP}}-<platform>, .exe on Windows) and
# manifest.json (version, each platform's file and SHA-256, and the what's-new
# notes). The version's section of CHANGELOG.md is both the release's
# description and those notes; the release stops if it has none.
#
# From Abalone (abalone::release::Workflow): change it there, not here.

name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    # Only from a tag: a manual run from a branch checks but never publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the package version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq '{{PACKAGE}}' | Select-Object -ExpandProperty version
          if ($version -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match {{PACKAGE}} version $version"
          }

      - name: Check CHANGELOG.md has the release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version $env:GITHUB_REF_NAME -OutDir notes

  build:
    needs: check
    strategy:
      matrix:
        include:
{{MATRIX}}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p {{PACKAGE}} --target ${{ matrix.target }}

      - name: Name the build for its platform
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.platform }}'.StartsWith('windows')) { '.exe' } else { '' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/{{APP}}$exe" "dist/{{APP}}-${{ matrix.platform }}$exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the release notes from CHANGELOG.md
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version $env:GITHUB_REF_NAME -OutDir notes

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the manifest
        shell: pwsh
        run: |
          $platforms = [ordered]@{}
          foreach ($f in Get-ChildItem dist | Sort-Object Name) {
            $platform = $f.Name.Substring('{{APP}}-'.Length) -replace '\.exe$', ''
            $platforms[$platform] = [ordered]@{
              file = $f.Name
              sha256 = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            }
          }
          $manifest = [ordered]@{ version = $env:GITHUB_REF_NAME; platforms = $platforms }
          # notes, and anything else release-notes.ps1 was given with -Extra.
          $whatsNew = Get-Content -Raw notes/whats-new.json | ConvertFrom-Json
          foreach ($p in $whatsNew.PSObject.Properties) { $manifest[$p.Name] = $p.Value }
          # UTF-8 without a BOM, so notes keep characters like dashes and accents.
          [IO.File]::WriteAllText("$PWD/manifest.json", ($manifest | ConvertTo-Json -Depth 6))

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The changelog section first, then GitHub's generated notes.
        run: gh release create "$GITHUB_REF_NAME" dist/* manifest.json --title "$GITHUB_REF_NAME" --notes-file notes/release-notes.md --generate-notes --verify-tag
